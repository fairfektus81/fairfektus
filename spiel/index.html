<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Piste Board</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #07131f; color: #f4f7fb; font-family: Outfit, ui-sans-serif, system-ui, sans-serif; }
      body { overflow: hidden; touch-action: none; user-select: none; }
      #stage { position: fixed; inset: 0; }
      #stage canvas { width: 100%; height: 100%; display: block; }
      .hud { position: fixed; inset: 0; pointer-events: none; }
      .hud button { pointer-events: auto; touch-action: none; cursor: pointer; }
      .sheet { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); display: flex; justify-content: center; }
      .card { width: min(28rem, 100%); display: flex; flex-direction: column; gap: 12px; }
      h1 { font-family: Fraunces, Georgia, serif; font-size: 3rem; line-height: 0.95; margin: 0; }
      .kicker { letter-spacing: 0.14em; text-transform: uppercase; font-size: 0.75rem; color: #9eb0c3; margin: 0; }
      .glass { background: rgba(16, 37, 54, 0.82); border: 1px solid rgba(255,255,255,0.08); border-radius: 1.25rem; padding: 14px 16px; }
      .muted { color: #9eb0c3; font-size: 0.92rem; line-height: 1.35; }
      .play { border: 0; border-radius: 999px; background: #4f92c9; color: #f7fbff; font: inherit; font-weight: 700; padding: 14px 18px; }
      .ghost { border: 0; border-radius: 999px; background: #102536; color: #f4f7fb; font: inherit; padding: 14px 18px; }
      .top { padding: 12px 16px 0; }
      .row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: start; }
      #time { font-family: Fraunces, Georgia, serif; font-size: 1.8rem; margin: 0; text-align: center; }
      #banner { text-align: center; font-family: Fraunces, Georgia, serif; font-size: 2rem; min-height: 2.4rem; margin: 12px 0 0; }
      .bar { height: 4px; background: #102536; }
      .bar > div { height: 100%; background: #e3b15a; transform: scaleX(0); transform-origin: left; }
      .pads { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; padding: 0 12px calc(10px + env(safe-area-inset-bottom)); }
      .dpad { display: grid; grid-template-columns: repeat(3, 3.15rem); grid-template-rows: repeat(3, 3.15rem); }
      .dpad button { border: 0; border-radius: 0.9rem; background: rgba(16, 37, 54, 0.78); color: #f4f7fb; font-size: 1.3rem; }
      .dpad button[data-on="true"] { background: #4f92c9; }
      .dpad[data-air="true"] button { box-shadow: inset 0 0 0 1px #e3b15a; }
      .u { grid-area: 1 / 2; } .l { grid-area: 2 / 1; } .r { grid-area: 2 / 3; } .d { grid-area: 3 / 2; }
      .cap { display: block; text-align: center; font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: #9eb0c3; margin-top: 4px; }
      #pause-btn { position: absolute; top: 52px; right: 16px; width: 44px; height: 44px; border: 0; border-radius: 999px; background: rgba(16,37,54,.85); color: #f4f7fb; }
      [hidden] { display: none !important; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Outfit:wght@420;700&display=swap" />
  </head>
  <body>
    <div id="stage"></div>
    <div class="hud">
      <section id="menu">
        <div class="sheet">
          <div class="card">
            <div>
              <p class="kicker">Abenteuer-Piste</p>
              <h1>Piste Board</h1>
            </div>
            <div class="glass muted">
              Snowboard-Downhill durch Eiswelle, Kanäle und Berg. Links lenken, oben schneller, unten bremsen. Rechts in der Luft: Cork, Rodeo, Indy, 180.
            </div>
            <button id="play" class="play" type="button">Spielen</button>
            <p id="best" class="muted" style="text-align:center"></p>
          </div>
        </div>
      </section>
      <section id="play-hud" hidden>
        <div class="bar"><div id="bar"></div></div>
        <div class="top row">
          <div><strong id="section">Startgasse</strong><div id="remain" class="muted">noch 2:58</div></div>
          <div><p id="time">0:00,00</p><div id="speed" class="muted" style="text-align:center">0 km/h</div></div>
          <strong id="score" style="text-align:right">0</strong>
        </div>
        <p id="banner"></p>
        <button id="pause-btn" type="button" aria-label="Pause">II</button>
        <div class="pads">
          <div>
            <div id="move-pad" class="dpad" aria-label="Fahren">
              <button class="u" type="button" data-dir="u" aria-label="Schneller">↑</button>
              <button class="l" type="button" data-dir="l" aria-label="Links">←</button>
              <button class="r" type="button" data-dir="r" aria-label="Rechts">→</button>
              <button class="d" type="button" data-dir="d" aria-label="Bremsen">↓</button>
            </div>
            <span class="cap">Fahren</span>
          </div>
          <div>
            <div id="trick-pad" class="dpad" data-air="false" aria-label="Trick">
              <button class="u" type="button" data-dir="u" aria-label="Indy">↑</button>
              <button class="l" type="button" data-dir="l" aria-label="Cork">←</button>
              <button class="r" type="button" data-dir="r" aria-label="Rodeo">→</button>
              <button class="d" type="button" data-dir="d" aria-label="180">↓</button>
            </div>
            <span class="cap">Trick</span>
          </div>
        </div>
      </section>
      <section id="pause" hidden>
        <div class="sheet">
          <div class="card glass">
            <h1>Pause</h1>
            <button id="resume" class="play" type="button">Weiter</button>
            <button id="restart" class="ghost" type="button">Neu</button>
          </div>
        </div>
      </section>
      <section id="finish" hidden>
        <div class="sheet">
          <div class="card glass">
            <p class="kicker">Ziel</p>
            <h1>Piazza</h1>
            <p id="finish-body" class="muted"></p>
            <button id="again" class="play" type="button">Nochmal</button>
          </div>
        </div>
      </section>
    </div>
    <script type="importmap">
      {
        "imports": {
          "three": "https://esm.sh/three@0.186.1",
          "three/addons/utils/BufferGeometryUtils.js": "https://esm.sh/three@0.186.1/addons/utils/BufferGeometryUtils.js"
        }
      }
    </script>
    <script type="module" src="./spiel.js"></script>
  </body>
</html>
